services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: "${POSTGRES_USER:-booking}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-booking}"
            POSTGRES_DB: "${POSTGRES_DB:-class_booking}"
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - ./pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking} -d ${POSTGRES_DB:-class_booking}"]
            interval: 5s
            timeout: 3s
            retries: 5

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_PORT: "5432"
            POSTGRES_USER: "${POSTGRES_USER:-booking}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-booking}"
            POSTGRES_DATABASE: "${POSTGRES_DB:-class_booking}"
            NODE_ENV: "${NODE_ENV:-development}"
        ports:
            - "${API_PORT:-3000}:3000"
        depends_on:
            postgres:
                condition: service_healthy
        profiles: ["full"]

volumes:
    pgdata:
